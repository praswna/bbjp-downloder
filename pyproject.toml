[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "bbjp-downloader"
version = "1.0.0"
description = "Download all galleries for a named person from a WordPress gallery site."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = [
    "requests>=2.25",
    "beautifulsoup4>=4.9",
    "pillow>=9.0",
    "PySide6>=6.5",
]

[project.optional-dependencies]
dev = ["pytest>=7.0"]

[project.scripts]
bbjp-downloader = "bbjp_downloader.cli:main"

[tool.setuptools]
packages = ["bbjp_downloader"]

[tool.pytest.ini_options]
testpaths = ["tests"]
